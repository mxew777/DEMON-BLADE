<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#100d16">
<title>Demon Blade — Prototype 0.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d16;color:#eee;font-family:system-ui, sans-serif;touch-action:none}
#game{display:block;width:100vw;height:100dvh;image-rendering:pixelated;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel{background:#17131dcc;border:1px solid #59404d;padding:9px 12px;border-radius:8px;box-shadow:0 4px 18px #0008}
.brand{font-weight:900;letter-spacing:2px;color:#ff5268;font-size:14px}.sub{font-size:10px;color:#b9aab3;letter-spacing:1px}
.bars{width:min(220px,42vw)}.barline{font-size:10px;color:#d9cbd1;margin:4px 0 3px;display:flex;justify-content:space-between}.bar{height:8px;background:#342b35;border:1px solid #55444f;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:#d94354;transition:width .15s}.fill.enemy{background:#a64bd0}
#hint{align-self:center;color:#bbaab5;font-size:11px;text-shadow:0 2px 4px #000;text-align:center}
.controls{display:flex;justify-content:space-between;align-items:flex-end;pointer-events:auto;padding:0 8px 12px}
#stick{width:116px;height:116px;border:2px solid #76606d88;border-radius:50%;background:#251d29aa;position:relative;touch-action:none}
#knob{position:absolute;width:46px;height:46px;border-radius:50%;background:#a58a9a99;border:2px solid #d7c1ce;left:33px;top:33px}
#attack{width:92px;height:92px;border-radius:50%;border:2px solid #ff8290;background:radial-gradient(circle at 35% 30%,#a83b52,#4c1728);color:white;font-weight:900;letter-spacing:1px;box-shadow:0 0 22px #a21e46aa;touch-action:none}
#attack:active{transform:scale(.94);filter:brightness(1.3)}
@media(min-width:800px){.controls{padding:0 30px 24px}#stick{width:130px;height:130px}#knob{left:39px;top:39px}#attack{width:100px;height:100px}}
</style>
</head>
<body>
<canvas id="game" width="480" height="270"></canvas>
<div id="hud">
 <div class="top">
  <div class="panel"><div class="brand">DEMON BLADE</div><div class="sub">PROTOTYPE 0.1 · DUNGEON</div></div>
  <div class="panel bars">
   <div class="barline"><span>DISCIPLE</span><span id="phptext">100 / 100</span></div><div class="bar"><div class="fill" id="php"></div></div>
   <div class="barline"><span>HOLLOW WRAITH</span><span id="ehptext">100 / 100</span></div><div class="bar"><div class="fill enemy" id="ehp"></div></div>
  </div>
 </div>
 <div id="hint">Move with the left pad · Tap ATTACK to strike the nearest enemy</div>
 <div class="controls"><div id="stick"><div id="knob"></div></div><button id="attack">ATTACK</button></div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
ctx.imageSmoothingEnabled=false;
const W=480,H=270;
const player={x:135,y:145,hp:100,faceX:1,faceY:0,inv:0};
let enemy={x:335,y:128,hp:100,max:100,alive:true,respawn:0,hit:0};
let keys={},joy={x:0,y:0},attackCooldown=0,combo=0,comboTimer=0,slash=0,shake=0,particles=[],time=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function target(){return enemy.alive?enemy:null}
function strike(){
 if(attackCooldown>0)return;
 const e=target();if(!e)return;
 const dx=e.x-player.x,dy=e.y-player.y,d=Math.hypot(dx,dy);
 if(d>112)return;
 const len=Math.max(1,d);player.faceX=dx/len;player.faceY=dy/len;
 combo=comboTimer>0?(combo%3)+1:1;comboTimer=42;attackCooldown=combo===3?32:19;slash=12;
 const reach=combo===3?100:82;
 if(d<=reach){
  const damage=[0,18,22,34][combo];e.hp=Math.max(0,e.hp-damage);e.hit=10;shake=combo===3?5:2;
  for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,s=1+Math.random()*2.8;particles.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:18+Math.random()*10})}
  if(e.hp<=0){e.alive=false;e.respawn=150}
 }
}
function update(){
 time++;if(attackCooldown>0)attackCooldown--;if(comboTimer>0)comboTimer--;else combo=0;if(slash>0)slash--;if(shake>0)shake*=.75;
 let mx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0)+joy.x;
 let my=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0)+joy.y;
 const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m}
 if(m>.08){player.x+=mx*1.55;player.y+=my*1.55;player.faceX=mx;player.faceY=my}
 player.x=clamp(player.x,35,445);player.y=clamp(player.y,55,235);
 if(enemy.alive){
  if(enemy.hit>0)enemy.hit--;
  const dx=player.x-enemy.x,dy=player.y-enemy.y,d=Math.hypot(dx,dy);
  if(d>25){enemy.x+=dx/d*.62;enemy.y+=dy/d*.62}
  if(d<24&&player.inv<=0){player.hp=Math.max(0,player.hp-8);player.inv=48;shake=3}
 }else if(--enemy.respawn<=0){enemy={x:335,y:128,hp:100,max:100,alive:true,respawn:0,hit:0};player.hp=Math.min(100,player.hp+15)}
 if(player.inv>0)player.inv--;
 particles=particles.filter(p=>p.life-->0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vx*=.9;p.vy*=.9}
 document.getElementById('php').style.width=player.hp+'%';document.getElementById('ehp').style.width=(enemy.hp||0)+'%';
 document.getElementById('phptext').textContent=player.hp+' / 100';
 document.getElementById('ehptext').textContent=enemy.alive?enemy.hp+' / 100':'DEFEATED';
}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function draw(){
 ctx.save();if(shake>.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 rect(0,0,W,H,'#17131c');
 // stone floor tiles
 for(let y=22;y<260;y+=24)for(let x=10;x<470;x+=32){rect(x,y,30,22,((x/32+y/24)%2)?'#29232d':'#302832');rect(x+1,y+1,28,1,'#403541')}
 // dungeon walls and pillars
 rect(0,0,W,18,'#0b0a10');rect(0,18,W,4,'#51404a');rect(0,0,9,H,'#0b0a10');rect(471,0,9,H,'#0b0a10');rect(0,258,W,12,'#0b0a10');
 for(const p of [[42,42],[425,42],[42,218],[425,218]]){rect(p[0]-7,p[1]-7,14,14,'#51404a');rect(p[0]-5,p[1]-5,10,10,'#211a25');rect(p[0]-2,p[1]-2,4,4,'#9d3e53')}
 // dim red floor sigil
 ctx.strokeStyle='#743047';ctx.globalAlpha=.35;ctx.lineWidth=1;ctx.beginPath();ctx.arc(240,135,48,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(240,87);ctx.lineTo(282,159);ctx.lineTo(198,159);ctx.closePath();ctx.stroke();ctx.globalAlpha=1;
 // enemy
 if(enemy.alive){
  const bob=Math.sin(time*.12)*1.5;ctx.fillStyle='#09070d';ctx.fillRect(enemy.x-8,enemy.y+6,17,5);
  rect(enemy.x-7,enemy.y-8+bob,14,17,enemy.hit?'#f2a0bd':'#66304e');rect(enemy.x-5,enemy.y-13+bob,10,8,'#311b36');
  rect(enemy.x-6,enemy.y-3+bob,4,2,'#ff526d');rect(enemy.x+2,enemy.y-3+bob,4,2,'#ff526d');
  rect(enemy.x-10,enemy.y+2+bob,4,9,'#40213f');rect(enemy.x+6,enemy.y+2+bob,4,9,'#40213f');
  ctx.fillStyle='#d54a70';ctx.globalAlpha=.3;ctx.beginPath();ctx.arc(enemy.x,enemy.y,15,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 }
 // player shadow and sprite
 ctx.fillStyle='#09070d';ctx.fillRect(player.x-8,player.y+7,17,5);
 if(player.inv===0||Math.floor(time/4)%2===0){
  rect(player.x-6,player.y-10,12,18,'#d4c6d0');rect(player.x-5,player.y-15,10,8,'#e2c6c9');rect(player.x-7,player.y-5,14,8,'#6f263d');
  rect(player.x-8,player.y+5,5,6,'#302332');rect(player.x+3,player.y+5,5,6,'#302332');
 }
 // sword, aimed toward facing
 const fx=player.faceX,fy=player.faceY,px=-fy,py=fx;
 const sx=player.x+fx*7,sy=player.y-2+fy*7;
 ctx.strokeStyle='#e7dce7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+fx*17,sy+fy*17);ctx.stroke();
 ctx.strokeStyle='#b73555';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx+px*3,sy+py*3);ctx.lineTo(sx-px*3,sy-py*3);ctx.stroke();
 if(slash>0){ctx.strokeStyle='#ff526d';ctx.globalAlpha=slash/12;ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x+fx*18,player.y+fy*18,combo===3?35:27,Math.atan2(fy,fx)-1.1,Math.atan2(fy,fx)+1.1);ctx.stroke();ctx.globalAlpha=1}
 for(const p of particles){rect(p.x,p.y,2,2,'#ff647e')}
 ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
window.addEventListener('keydown',e=>{keys[e.key]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key===' ')strike()});
window.addEventListener('keyup',e=>keys[e.key]=false);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let pointer=null;
function joyMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const max=r.width*.32,d=Math.hypot(dx,dy);if(d>max){dx=dx/d*max;dy=dy/d*max}joy.x=dx/max;joy.y=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);joyMove(e)});
stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)joyMove(e)});
function joyEnd(){pointer=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}
stick.addEventListener('pointerup',joyEnd);stick.addEventListener('pointercancel',joyEnd);
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();strike()});
})();
</script>
</body>
</html>
